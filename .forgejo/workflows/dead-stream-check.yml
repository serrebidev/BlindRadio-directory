name: Weekly dead-stream check

# Local keep: this repo's automation runs on the local Forgejo runners,
# never GitHub (Brandon, 2026-11-20).
on:
  schedule:
    - cron: '15 11 * * 1'
  workflow_dispatch:

jobs:
  check:
    name: Probe directory streams and swap in highest-quality replacements
    runs-on: wsl-linux
    steps:
      - uses: actions/checkout@v4
      - name: Run the dead-stream check
        run: |
          python3 --version
          mkdir -p reports
          python3 tools/dead-stream-check.py --root . --report reports/latest.json
      - name: Commit playlist fixes and the run report
        run: |
          git config user.name "BlindRadio directory check"
          git config user.email "directory-check@serrebiradio.com"
          git add -- '*.m3u' reports/latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          SUMMARY=$(python3 -c "import json; r=json.load(open('reports/latest.json')); print(f\"{len(r['replaced'])} replaced, {len(r['unreplaced'])} dead with no replacement, {r['checked']} checked\")")
          git commit -m "Weekly dead-stream check: $SUMMARY"
          git push
